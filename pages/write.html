
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Write a Story | StorySpace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!--Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/write.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-3">

        <div class="container">

            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-feather"></i>
                StorySpace
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#writeNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="writeNavbar">

                <ul class="navbar-nav ms-auto gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="explore.html">Explore</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="saved.html">Saved Stories</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Writing Section -->
    <section class="write-section">

        <div class="container">

            <!-- Page Heading -->
            <div class="write-heading">

                <span class="write-label">YOUR CREATIVE SPACE</span>

                <h1>Create Your Story</h1>

                <p>
                    Every great story begins with an idea.
                    Start writing yours today.
                </p>

            </div>


            <!-- Writing Editor -->
            <div class="write-card">

                <form id="storyForm">

                    <!-- Story Title -->
                    <div class="mb-4">

                        <label for="storyTitle" class="form-label">
                            Story Title
                        </label>

                        <input
                            type="text"
                            id="storyTitle"
                            class="form-control title-input"
                            placeholder="Give your story a title..."
                            maxlength="100"
                            required>

                    </div>


                    <!-- Category -->
                    <div class="mb-4">

                        <label for="storyCategory" class="form-label">
                            Category
                        </label>

                        <select
                            id="storyCategory"
                            class="form-select"
                            required>

                            <option value="">Choose a category</option>
                            <option value="Technology">Technology</option>
                            <option value="Programming">Programming</option>
                            <option value="Lifestyle">Lifestyle</option>
                            <option value="Travel">Travel</option>
                            <option value="Business">Business</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <!-- Short Description -->
                    <div class="mb-4">

                        <label for="storyDescription" class="form-label">
                            Short Description
                        </label>

                        <textarea
                            id="storyDescription"
                            class="form-control"
                            rows="3"
                            maxlength="250"
                            placeholder="Briefly describe your story..."
                            required></textarea>

                    </div>


                    <!-- Cover Image -->
                    <div class="mb-4">

                        <label for="storyCover" class="form-label">
                            Cover Image
                        </label>

                        <input
                            type="file"
                            id="storyCover"
                            class="form-control"
                            accept="image/png, image/jpeg, image/webp">

                        <div id="coverPreview" class="cover-preview d-none">

                            <img id="previewImage" src="" alt="Cover preview">

                        </div>

                    </div>


                    <!-- Story Content -->
                    <div class="mb-4">

                        <label for="storyContent" class="form-label">
                            Your Story
                        </label>

                        <textarea
                            id="storyContent"
                            class="form-control story-editor"
                            rows="14"
                            placeholder="Start writing your story here..."
                            required></textarea>

                        <div class="word-count">
                            <span id="wordCount">0</span> words
                        </div>

                    </div>


                    <!-- Editor Actions -->
                    <div class="write-actions">

                        <button
                            type="button"
                            id="previewStory"
                            class="btn btn-outline-success">

                            <i class="bi bi-eye"></i>
                            Preview

                        </button>

                        <button
                            type="button"
                            id="saveDraft"
                            class="btn btn-outline-secondary">

                            <i class="bi bi-save"></i>
                            Save Draft

                        </button>

                        <button
                            type="submit"
                            id="publishStory"
                            class="btn btn-success">

                            <i class="bi bi-check-circle"></i>
                            Publish Story

                        </button>

                    </div>

                    <p id="writeMessage" class="mt-3"></p>

                </form>

            </div>

        </div>

    </section>


    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">

        <div class="modal-dialog modal-lg modal-dialog-scrollable">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">Story Preview</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <img
                        id="modalCover"
                        class="preview-modal-image d-none"
                        src=""
                        alt="Story cover">

                    <span id="modalCategory" class="write-label"></span>

                    <h2 id="modalTitle" class="preview-title"></h2>

                    <p id="modalDescription" class="text-muted"></p>

                    <hr>

                    <div id="modalContent" class="preview-content"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="py-4 text-center">

        <p class="mb-0">
            © 2026 StorySpace. Every Story Has a Place.
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Writing JavaScript -->
    <script src="../js/write.js"></script>

</body>
</html>
