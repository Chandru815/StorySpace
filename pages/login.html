
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StorySpace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!--Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Login Page -->
    <section class="auth-section">

        <div class="container">

            <div class="auth-card">

                <!-- Left Side -->
                <div class="auth-banner">

                    <a href="../index.html" class="auth-logo">
                        <i class="bi bi-feather"></i>
                        StorySpace
                    </a>

                    <div class="auth-banner-content">

                        <h1>Every Story Has a Place.</h1>

                        <p>
                            Welcome back to a space filled with ideas,
                            creativity and inspiring stories.
                        </p>

                    </div>

                    <p class="auth-footer-text">
                        © 2026 StorySpace
                    </p>

                </div>


                <!-- Right Side -->
                <div class="auth-form-container">

                    <div class="auth-form">

                        <a href="../index.html" class="back-home">
                            <i class="bi bi-arrow-left"></i>
                            Back to Home
                        </a>

                        <h2>Welcome Back!</h2>

                        <p class="auth-description">
                            Login to continue exploring stories.
                        </p>


                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-4">

                                <label for="loginEmail" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="loginEmail"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="loginPassword" class="form-label">
                                    Password
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="loginPassword"
                                        placeholder="Enter your password"
                                        required>

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-target="loginPassword"
                                        aria-label="Show password">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- Remember Me -->
                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberMe">

                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>

                                </div>

                            </div>


                            <!-- Login Button -->
                            <button type="submit" class="auth-submit-btn">
                                Login
                                <i class="bi bi-arrow-right"></i>
                            </button>

                            <p id="loginMessage" class="auth-message"></p>

                        </form>


                        <div class="auth-switch">
                            Don't have an account?
                            <a href="register.html">Create an account</a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

</body>
</html>
