
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | StorySpace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!--Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <section class="auth-section">

        <div class="container">

            <div class="auth-card">

                <!-- Left Side -->
                <div class="auth-banner">

                    <a href="../index.html" class="auth-logo">
                        <i class="bi bi-feather"></i>
                        StorySpace
                    </a>

                    <div class="auth-banner-content">

                        <h1>Your Next Story Starts Here.</h1>

                        <p>
                            Join StorySpace and discover a world
                            of ideas, creativity and inspiration.
                        </p>

                    </div>

                    <p class="auth-footer-text">
                        © 2026 StorySpace
                    </p>

                </div>


                <!-- Right Side -->
                <div class="auth-form-container">

                    <div class="auth-form">

                        <a href="../index.html" class="back-home">
                            <i class="bi bi-arrow-left"></i>
                            Back to Home
                        </a>

                        <h2>Create Account</h2>

                        <p class="auth-description">
                            Sign up to become part of StorySpace.
                        </p>


                        <form id="registerForm">

                            <!-- Full Name -->
                            <div class="mb-3">

                                <label for="registerName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="registerName"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="registerEmail" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="registerEmail"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="registerPassword" class="form-label">
                                    Password
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="registerPassword"
                                        placeholder="Create a password"
                                        minlength="6"
                                        required>

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-target="registerPassword"
                                        aria-label="Show password">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- Confirm Password -->
                            <div class="mb-3">

                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        placeholder="Confirm your password"
                                        required>

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-target="confirmPassword"
                                        aria-label="Show password">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- Terms -->
                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="acceptTerms"
                                    required>

                                <label class="form-check-label" for="acceptTerms">
                                    I agree to the Terms and Conditions
                                </label>

                            </div>


                            <!-- Register Button -->
                            <button type="submit" class="auth-submit-btn">
                                Create Account
                                <i class="bi bi-arrow-right"></i>
                            </button>

                            <p id="registerMessage" class="auth-message"></p>

                        </form>


                        <div class="auth-switch">
                            Already have an account?
                            <a href="login.html">Login</a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

</body>
</html>
