
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Articles | StorySpace</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!--Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Project CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/explore.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-3">
        <div class="container">

            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-feather"></i>
                StorySpace
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="explore.html">Explore</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="saved.html">Saved Stories</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Saved Articles Section -->
    <section class="explore-section py-5">

        <div class="container">

            <div class="text-center mb-5">

                <span class="article-category">
                    YOUR COLLECTION
                </span>

                <h1 class="display-5 mt-3">
                    Saved Articles
                </h1>

                <p class="text-muted">
                    Your favourite stories, all in one place.
                </p>

            </div>


            <!-- Bookmark Count -->
            <p class="text-muted mb-4" id="savedCount">
                0 saved articles
            </p>


            <!-- Saved Articles Grid -->
            <div class="row g-4" id="savedArticles">

            </div>


            <!-- Empty State -->
            <div class="text-center py-5 d-none" id="emptyState">

                <i class="bi bi-bookmark display-1 text-muted"></i>

                <h3 class="mt-4">
                    No saved articles yet
                </h3>

                <p class="text-muted">
                    Explore StorySpace and bookmark stories you enjoy.
                </p>

                <a href="explore.html" class="btn btn-success mt-3">
                    Explore Articles
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="py-4 text-center">
        <p class="mb-0">
            © 2026 StorySpace. Every Story Has a Place.
        </p>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Articles Data -->
    <script src="../js/article.js"></script>

    <!-- Saved Articles Logic -->
    <script src="../js/saved.js"></script>

</body>
</html>
